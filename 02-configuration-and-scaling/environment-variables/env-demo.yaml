apiVersion: v1
kind: Pod
metadata: 
  name: env-demo
spec:
  containers: 
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: APP_NAME
          value: "kubernets Learning"
        - name: APP_DEV
          value: "developement"
        - name: PORT 
          value: "3000"  